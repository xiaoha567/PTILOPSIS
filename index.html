<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
RHINE LAB DATABASE
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     背景LOGO
========================= -->

<div class="background-logo">

<img src="assets/logo.png">

</div>




<!-- =========================
     主页面
========================= -->


<main id="mainPage">


<section class="terminal">



<!-- 顶部区域 -->

<header class="header">


<img 
class="header-logo"
src="assets/logo.png"
alt="Rhine Lab">


<div class="header-text">


<div class="header-title">

RHINE LAB

</div>


<div class="header-subtitle">

INTERNAL DATABASE

</div>


</div>


</header>





<!-- 系统日志 -->

<section id="systemText">


</section>





<!-- 二进制显示区域 -->


<section class="binary-area">


<div id="binary"></div>


<div class="sit-character">

<img 
src="assets/ptilopsis_sit.gif"
alt="Ptilopsis Sit">

</div>


</section>





<!-- 数据解析按钮 -->


<button id="decodeButton">

数据解析

</button>




<!-- =========================
     解锁结果
========================= -->


<section id="resultBox">



<div class="result-title">

ARCHIVE DECODED

</div>




<div class="result-content">






<div class="message-area">



<img
class="ptilopsis"
src="assets/ptilopsis.png"
alt="Ptilopsis">





<div class="message-text">


祝愿屏幕前面的博士和管理员——平安，快乐


</div>



</div>



</div>



</section><!-- =========================
     底部状态
========================= -->


<footer class="footer">


<div>

STATUS : CLASSIFIED

</div>


<div>

Good Luck, Doctor & Administrator.

</div>


</footer>



</section>


</main>



<!-- =========================
     JavaScript
========================= -->


<script src="script.js"></script>


</body>

</html>
